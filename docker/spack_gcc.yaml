spack:
  packages:
    all:
      compiler: [gcc@13.2.0]
  specs:
  - cmake
  - gmake
  - hdf5
  - netcdf-c+mpi+parallel-netcdf
  - netcdf-fortran
  - openmpi
  concretizer:
    unify: true
  config:
    install_missing_compilers: true
    install_tree: /opt/software
  view: /opt/views/view
  compiler:
    spec: gcc@=13.2.0
    paths:
      cc: /usr/bin/gcc
      cxx: /usr/bin/g++
      f77: /usr/bin/gfortran
      fc: /usr/bin/gfortran
    flags: {}
    operating_system: ubuntu24.04
    target: x86_64
    modules: []
    environment: {}
    extra_rpaths: []
