name: Periodic Docker build with Intel compiler

on:
  # Build the Docker container whenever commits are pushed to an open PR that changes one of the files listed
  pull_request:
    paths:
      - .github/workflows/docker_intel.yml
      - docker/Dockerfile.intel
      - docker/spack_intel.yaml

  # Build the Docker container at 00:00 on the first day of every 3 months
  schedule:
    - cron: '0 0 1 */3 *'

# Cancel jobs running if new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: Build Docker container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout the repo
        with:
          persist-credentials: false
        uses: actions/checkout@v4

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into GitHub Container Repository
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          logout: true

      - name: Build container and push to ghcr
        uses: docker/build-push-action@v5
        with:
          push: true
          file: docker/Dockerfile.intel
          tags: ghcr.io/fetch4/giss-gc-dev-env-intel:latest
